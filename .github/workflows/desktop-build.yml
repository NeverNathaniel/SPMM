name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build

  package-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: migration-mapper-windows
          path: |
            release/*.exe
          if-no-files-found: error

  release:
    needs: package-windows
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: migration-mapper-windows
          path: release-artifacts
      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="## Migration Mapper v${VERSION}

          Windows installer and portable executable for Migration Mapper — a tool for visually mapping local/network folder structures to SharePoint Online destinations and exporting SPMT-compatible migration files.

          ### Installation
          - **Setup (recommended):** Run the \`*-Setup-*.exe\` installer
          - **Portable:** Run the \`*-Portable-*.exe\` directly — no installation needed

          ### Usage
          Technicians can place a \`tech-config.json\` next to the executable to pre-configure tenant domain, presets, and thresholds."

          # Idempotent: if the tag already exists, refresh its assets instead of
          # failing; otherwise create the release. Lets a re-run update a build.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} exists — uploading assets with --clobber."
            gh release upload "v${VERSION}" release-artifacts/*.exe --clobber
          else
            echo "Creating release v${VERSION}."
            gh release create "v${VERSION}" \
              --title "Migration Mapper v${VERSION}" \
              --notes "${NOTES}" \
              release-artifacts/*.exe
          fi
